# Every topology, once, as a worked example of the vocabulary. Copy to tasks.toml
# and edit. `topology` and `source_mode` are required; `case`, `position` and
# `match_mode` default to sensitive / prefix / longest.

[run]
budget_bits = 48       # nonces per edge = 2^32, counting from zero every time
csv = "results.csv"

[[task]]
label       = "But I can't just be a girl!"
topology    = "chain"
source_mode = "plain"
encoding    = "ascii8"
case        = "sensitive"
words       = [ "But I can't be a girl!", "yes", "you", "can" ]

[[task]]
label       = "passions"
topology    = "star_from"
source_mode = "plain"
encoding    = "ascii8"
case        = "insensitive"
hub         = "passions"
words       = [ "joy", "love", "wonder", "hatred", "desire", "sorrow" ]

[[task]]
label       = "shape"
topology    = "ring"
source_mode = "plain"
encoding    = "ascii8"
case        = "insensitive"
words       = [ "dot", "arc", "line", "curve", "plane", "circle", "square",
                "star", "spiral" ]

[[task]]
label       = "gender"
topology    = "star_from"
source_mode = "plain"
encoding    = "ascii8"
hub         = "gender"
words       = [ "she", "her", "they", "girl", "woman", "femme", "butch",
                "demi", "trans", "queer" ]

