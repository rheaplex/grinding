# The return grind for Attribution: artist itself being ground, from rhea
# and from myers. generate.js picks these up as the work's return searches
# once rows land in results.csv.
[[task]]
label       = "attribution"
topology    = "star_to"
source_mode = "plain"
encoding    = "ascii8"
hub         = "artist"
words       = [ "rhea", "myers" ]

[[task]]
label       = "pattern"
topology    = "star_from"
source_mode = "plain"
encoding    = "ascii8"
hub         = "pattern"
words       = [ "plain", "grid", "checks", "dots", "stripes", "hexes",
                "repeat", "glitch", "floral" ]

[[task]]
label       = "saturation"
topology    = "chain"
source_mode = "plain"
encoding    = "ascii8"
words       = [ "grey", "dull", "muted", "mild", "rich", "deep", "strong",
                "vivid", "neon" ]

[[task]]
label       = "brightness"
topology    = "chain"
source_mode = "plain"
encoding    = "ascii8"
words       = [ "black", "dark", "dim", "grey", "medium", "light", "pale",
                "bright", "white" ]
