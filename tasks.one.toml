# Every topology, once, as a worked example of the vocabulary. Copy to tasks.toml
# and edit. `topology` and `source_mode` are required; `case`, `position` and
# `match_mode` default to sensitive / prefix / longest.

[run]
budget_bits = 42       # nonces per edge = 2^32, counting from zero every time
csv = "results.csv"

########################################################################
# Base
########################################################################

[[task]]
label       = "hue"
topology    = "ring"
source_mode = "plain"
encoding    = "ascii8"
words       = [ "red", "blue", "pink", "grey", "black", "white", "green",
                "brown", "yellow", "purple", "orange" ]

[[task]]
label       = "number"
topology    = "chain"
source_mode = "plain"
encoding    = "ascii8"
words       = [ "zero", "one", "two", "three", "four", "five",
                "six", "seven", "eight", "nine", "ten", "eleven", "twelve" ]

[[task]]
label       = "passions"
topology    = "star_to"
source_mode = "plain"
encoding    = "ascii8"
case        = "insensitive"
hub         = "passions"
words       = [ "joy", "love", "wonder", "hatred", "desire", "sorrow" ]

[[task]]
label       = "shape"
topology    = "star_to"
source_mode = "plain"
encoding    = "ascii8"
case        = "insensitive"
hub         = "shape"
words       = [ "dot", "arc", "line", "curve", "plane", "circle", "square",
                "star", "spiral" ]

[[task]]
label       = "value"
topology    = "star_to"
hub         = "art"
source_mode = "plain"
encoding    = "ascii8"
words       = [ "use", "utility", "aura", "price", "worth" ] #, "exchange",
            #   "historical", "aesthetic", "provenance" ]

[[task]]
label       = "direction"
topology    = "star_from"
source_mode = "plain"
encoding    = "ascii8"
hub         = "center"
words       = [ "up", "in", "out", "down", "left", "over", "under", "right" ]


